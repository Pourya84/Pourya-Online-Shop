{% extends 'store/main.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-success text-white text-center rounded-top-4 py-3">
          <h4 class="mb-0">✅ ایمیل ارسال شد</h4>
        </div>
        <div class="card-body p-4 text-center">
          <div class="mb-4">
            <i class="fas fa-envelope-open-text" style="font-size: 4rem; color: #27ae60;"></i>
          </div>
          <h5>لینک بازنشانی رمز عبور برای شما ارسال شد.</h5>
          <p class="text-muted">
            لطفاً ایمیل خود را بررسی کنید. اگر ایمیلی دریافت نکردید، مطمئن شوید که آدرس ایمیل صحیح را وارد کرده‌اید.
          </p>
          <div class="mt-4">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary rounded-pill px-4">بازگشت به صفحه ورود</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
