<!-- ===== change_password_done.html ===== -->
{% extends 'store/main.html' %}
{% load static %}

{% block content %}
<style>
  .success-card {
    border: none;
    border-radius: 30px;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(0, 0, 0, 0.10);
    transition: transform 0.3s ease;
    text-align: center;
  }
  .success-card:hover {
    transform: translateY(-4px);
  }
  .success-card .card-header {
    background: linear-gradient(145deg, #27ae60, #2ecc71);
    padding: 2rem 1.5rem;
    border-bottom: none;
  }
  .success-card .card-header i {
    font-size: 4rem;
    color: #fff;
  }
  .success-card .card-body {
    padding: 2.5rem 2rem;
    background: #ffffff;
  }
  .success-card .card-body h3 {
    color: #2d3436;
    font-weight: 700;
    margin-bottom: 1rem;
  }
  .success-card .card-body p {
    color: #6c757d;
    font-size: 1.05rem;
    margin-bottom: 1.8rem;
  }
  .success-card .btn-return {
    border-radius: 30px;
    padding: 0.7rem 2.5rem;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    background: linear-gradient(145deg, #27ae60, #2ecc71);
    color: #fff;
    transition: all 0.3s ease;
    display: inline-block;
    text-decoration: none;
  }
  .success-card .btn-return:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(39, 174, 96, 0.35);
    color: #fff;
  }
  @media (max-width: 576px) {
    .success-card .card-body {
      padding: 1.8rem 1.2rem;
    }
    .success-card .card-body h3 {
      font-size: 1.3rem;
    }
  }
</style>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card success-card">
        <div class="card-header">
          <i class="fas fa-check-circle"></i>
        </div>
        <div class="card-body">
          <h3>✅ رمز عبور با موفقیت تغییر کرد</h3>
          <p>رمز عبور شما به‌روزرسانی شد. اکنون می‌توانید با رمز جدید وارد شوید.</p>
          <a href="{% url 'store:store_panel' %}" class="btn-return">
            🛒 بازگشت به فروشگاه
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
