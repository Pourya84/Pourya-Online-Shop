{% extends 'store/main.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/auth_style.css' %}">
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">تغییر رمز عبور</div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="id_old_password">رمز فعلی:</label>
                            <div class="password-wrapper">
                                <input type="password" name="old_password" id="id_old_password" class="form-control" required>
                                <button type="button" class="toggle-password" data-target="id_old_password">😒</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="id_new_password1">رمز جدید:</label>
                            <div class="password-wrapper">
                                <input type="password" name="new_password1" id="id_new_password1" class="form-control" required>
                                <button type="button" class="toggle-password" data-target="id_new_password1">😒</button>
                            </div>
                            <small class="form-text text-muted">حداقل ۸ کاراکتر و نه کاملاً عددی</small>
                        </div>
                        <div class="form-group">
                            <label for="id_new_password2">تکرار رمز جدید:</label>
                            <div class="password-wrapper">
                                <input type="password" name="new_password2" id="id_new_password2" class="form-control" required>
                                <button type="button" class="toggle-password" data-target="id_new_password2">😒</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">تغییر رمز</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            if (input.type === 'password') {
                input.type = 'text';
                this.textContent = '🧐';
            } else {
                input.type = 'password';
                this.textContent = '😒';
            }
        });
    });
</script>
{% endblock %}
